name: Windows v0.2.3 installer
on:
  push:
    branches: [release/v0.2.3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fs-elem-v023-windows-installer
  cancel-in-progress: false
jobs:
  build-install:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: science
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - id: pose
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.13'
          architecture: x64
      - name: Resolve build-host Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno compiler installation failed' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler missing' }
          # Compatibility/version comes from the bounded CLI engine probe in the builder.
          # ISCC.exe may have no FileVersion resource; /? only reports its major version.
          Write-Host "Resolved compiler path=$iscc SHA256=$((Get-FileHash -LiteralPath $iscc -Algorithm SHA256).Hash)"
      - name: Build self-contained installer and check native installation
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -PackageRoot $env:GITHUB_WORKSPACE -WorkRoot (Join-Path $env:RUNNER_TEMP 'fs-elem-v023-installer') -SciencePython '${{ steps.science.outputs.python-path }}' -PosePython '${{ steps.pose.outputs.python-path }}' -NativeCheck
      - name: Save Setup.exe and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-elem-v023-windows-setup-${{ github.run_id }}
          path: ${{ runner.temp }}/fs-elem-v023-installer/artifacts/*
          if-no-files-found: warn
          retention-days: 14
      - name: Save bounded native build and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-elem-v023-windows-install-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fs-elem-v023-installer/build-summary.json
            ${{ runner.temp }}/fs-elem-v023-installer/build-inputs.json
            ${{ runner.temp }}/fs-elem-v023-installer/compiler-input.json
            ${{ runner.temp }}/fs-elem-v023-installer/vc-runtime-inputs.json
            ${{ runner.temp }}/fs-elem-v023-installer/native-install-check.json
            ${{ runner.temp }}/fs-elem-v023-installer/logs/*
          if-no-files-found: warn
          retention-days: 14
