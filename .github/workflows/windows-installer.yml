name: Windows v0.2.2 installer
on:
  push:
    branches: [release/v0.2.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fs-elem-v022-windows-installer
  cancel-in-progress: false
jobs:
  build-install:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: science
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - id: pose
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.13'
          architecture: x64
      - name: Install build-host Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --yes --no-progress --force
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler installation failed' }
      - name: Build self-contained installer and check native installation
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -PackageRoot $env:GITHUB_WORKSPACE -WorkRoot (Join-Path $env:RUNNER_TEMP 'fs-elem-v022-installer') -SciencePython '${{ steps.science.outputs.python-path }}' -PosePython '${{ steps.pose.outputs.python-path }}' -NativeCheck
      - name: Save Setup.exe and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-elem-v022-windows-setup-${{ github.run_id }}
          path: ${{ runner.temp }}/fs-elem-v022-installer/artifacts/*
          if-no-files-found: warn
          retention-days: 14
      - name: Save bounded native build and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-elem-v022-windows-install-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fs-elem-v022-installer/build-summary.json
            ${{ runner.temp }}/fs-elem-v022-installer/build-inputs.json
            ${{ runner.temp }}/fs-elem-v022-installer/vc-runtime-inputs.json
            ${{ runner.temp }}/fs-elem-v022-installer/native-install-check.json
            ${{ runner.temp }}/fs-elem-v022-installer/logs/*
          if-no-files-found: warn
          retention-days: 14

