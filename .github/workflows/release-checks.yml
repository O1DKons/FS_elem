name: v0.2.1 curated payload boundary
on:
  push:
    branches: [release/v0.2.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify final source inventory and public asset boundary
        run: node scripts/verify-release-payload.mjs .
      # Native installation/lifecycle runs in windows-release-checks.yml.
      # Closed historical whole suites and inference are not replayed here.
